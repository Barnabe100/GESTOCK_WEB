# Plans commerciaux (offres Web : facturation mensuelle ou annuelle, pas de licence perpétuelle).
#
# Plan → limites → modules → fonctionnalités → politiques (ADR-0012).
#   - modules        : modules inclus (les modules « core » le sont toujours) ;
#   - features       : fonctionnalités optionnelles déclarées par les modules ;
#   - [limits]       : plafonds ; une limite absente est illimitée. Codes déclarés par les
#                      modules (max_sites : organization, max_users : users) ;
#   - grace_days     : délai de grâce avant expiration ; politiques : subscription_policies.toml.
# Valeurs validées par TechNova le 2026-09-23. Source de vérité : ce fichier, synchronisé en
# base par `stockmanager catalog sync`.

[plans.STANDARD]
name = "Standard"
description = "Offre de base pour un commerce."
sort_order = 10
grace_days = 7
modules = [
  "catalog", "suppliers", "customers", "stock", "inventory_count", "sales", "receivables", "payments",
  "cash_register", "pos", "reports", "alerts",
  "restaurant.menu", "restaurant.tables", "restaurant.orders", "restaurant.kitchen",
  "restaurant.recipes",
]
features = []

[plans.STANDARD.limits]
max_sites = 1
max_users = 5

[plans.ENTREPRISE]
name = "Entreprise"
description = "Multi-sites et fonctionnalités avancées."
sort_order = 20
grace_days = 15
modules = [
  "catalog", "suppliers", "customers", "stock", "inventory_count", "sales", "receivables", "payments",
  "cash_register", "pos", "reports", "alerts",
  "restaurant.menu", "restaurant.tables", "restaurant.orders", "restaurant.kitchen",
  "restaurant.recipes", "restaurant.qr",
]
# Transferts inter-sites (Phase 2.5) : permissions stock.transfer.* accordées seulement ici.
features = ["stock.transfers"]

# Aucune limite déclarée = illimité.
[plans.ENTREPRISE.limits]
