# Profil UX de la restauration (voir retail.default.toml pour le format).
#
# Un module encore PLANIFIÉ (salle / tables, commandes, cuisine, QR, recettes) est déclaré
# ici pour préparer l'interface : il n'apparaît ni au menu ni au tableau de bord tant qu'il
# n'est pas implémenté (statut `available`), inclus au plan et activé (le menu est livré, R1).
#
# Modules activés par défaut / facultatifs (ADR-0049, D11) : cette présentation porte le cas
# Maquis, Bar, Café, Boulangerie (menu et commandes ; salle, postes, QR, recettes
# facultatifs) ; Restaurant, Pizzeria, Traiteur et Restauration rapide la surchargent dans
# leur profil. Le paiement par défaut est porté par `[module_settings]` de chaque profil.

code = "restaurant.default"
name = "Restauration — présentation standard"
description = "Service et encaissement au premier plan ; produits et stock en appui."

modules = [
  "catalog", "suppliers", "customers", "stock", "inventory_count", "sales", "receivables",
  "payments", "cash_register", "pos", "reports", "alerts",
  "restaurant.menu", "restaurant.orders",
]
optional_modules = [
  "restaurant.tables", "restaurant.kitchen", "restaurant.qr", "restaurant.recipes",
]

[[navigation]]
group = "home"
modules = ["dashboard"]

[[navigation]]
group = "restaurant"
modules = [
  "restaurant.tables", "restaurant.orders", "restaurant.kitchen", "restaurant.menu",
  "restaurant.recipes", "restaurant.qr",
]

[[navigation]]
group = "sales"
modules = ["pos", "sales", "customers", "receivables"]

[[navigation]]
group = "cash"
modules = ["cash_register"]

[[navigation]]
group = "stock"
modules = ["catalog", "stock", "inventory_count", "alerts", "suppliers"]

[[navigation]]
group = "reports"
modules = ["reports"]

[[navigation]]
group = "admin"
modules = ["organization", "users", "subscription", "audit"]

[dashboard]
# Les indicateurs de salle et de cuisine s'afficheront avec leurs modules.
widgets = [
  "sales:today", "cash_register:open_sessions", "restaurant.tables:occupied",
  "restaurant.orders:in_progress", "restaurant.kitchen:ready", "receivables:outstanding",
  "alerts:out_of_stock", "alerts:low_stock", "sales:recent",
]
shortcuts = ["pos:open", "sales:new", "stock:entry"]

[terminology.fr.catalog]
item = "Produit"
items = "Produits"

[theme]
accent = "orange"
density = "comfortable"
