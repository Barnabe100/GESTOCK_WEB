# Rôles de base (rôles système) proposés à chaque entreprise, instanciés à sa création ou à la
# demande (POST /roles/from-template). Les permissions sont des motifs (`module.*`, `*.view`)
# **résolus à l'exécution** contre le registre (ADR-0013) : un nouveau module enrichit
# automatiquement les rôles concernés, sans migration de données. `exclude` retire des motifs
# du résultat ; `protected` interdit toute désactivation ou modification par le tenant.
# `auto_provision = false` (défaut : true) : modèle facultatif, jamais créé automatiquement
# dans les entreprises, ajouté à la demande seulement (ADR-0049, D12).
# Aucune permission de module non développé : les modèles sont complétés quand le module existe.
# Le propriétaire n'est pas un rôle : c'est un attribut de l'appartenance (is_owner).
# Les codes sont stables (référencés en base par roles.template_code) ; les noms sont affichés.

[roles.administrator]
name = "Administrateur"
description = "Administration complète de l'entreprise (tous les modules de l'offre)."
permissions = ["*"]
protected = true

[roles.manager]
name = "Gestionnaire"
description = "Catalogue (consultation des coûts, sans modification des prix), fournisseurs, clients (sans leur limite de crédit), ventes (toutes celles du site, à crédit comprises, sans dépassement de limite, export de l'historique, impression et réimpression des reçus), encaissements et créances (consultation), caisses (sessions, entrées et sorties), point de vente, stock (entrées, sorties, transferts, seuils, emplacements, inventaires), alertes et restauration (menu et commandes des sites, réattribution et réglages compris), sans annulation (sauf des inventaires non validés) ni gestion des motifs de sortie."
permissions = [
  "catalog.*",
  "suppliers.*",
  "customers.*",
  "sales.sale.view", "sales.sale.view_all", "sales.sale.export", "sales.sale.create",
  "sales.sale.update", "sales.sale.validate", "sales.sale.credit_create",
  "sales.sale.receipt_print", "sales.sale.reprint",
  "sales.payment.view", "sales.payment.create",
  "receivables.receivable.view",
  "cash_register.*",
  "pos.*",
  "stock.level.view", "stock.threshold.manage", "stock.location.manage",
  "stock.movement.view",
  "stock.entry.view", "stock.entry.create", "stock.entry.update", "stock.entry.validate",
  "stock.exit.view", "stock.exit.create", "stock.exit.update", "stock.exit.validate",
  "stock.transfer.view", "stock.transfer.create", "stock.transfer.update",
  "stock.transfer.validate",
  "alerts.*",
  "inventory_count.*",
  # Restauration (ADR-0049) : toutes les permissions des modules restaurant LIVRÉS (R1 : menu).
  "restaurant.*",
  "subscription.activation.check",
]
# Limite de crédit des clients (Lot 2) et modification des prix catalogue (Lot 3-A) : réservées
# à l'Administrateur par défaut ; un rôle personnalisé peut les accorder. Le Gestionnaire voit
# en revanche les coûts internes (``catalog.article.cost_view``, inclus par ``catalog.*``).
exclude = [
  "customers.credit_limit.manage",
  "catalog.article.price_update",
]

[roles.seller]
name = "Vendeur"
description = "Vente comptant sans crédit (ses propres ventes : création, modification et validation, encaissement, impression et réimpression des reçus, ouverture et clôture de caisse, point de vente), consultation des articles, du stock, des alertes, des inventaires, des clients, des créances et du menu (avec « épuisé »), commandes de restauration (saisie, prise en charge, préparation, service, annulation des lignes reçues), sans annulation de ventes ni de documents validés."
permissions = [
  "catalog.article.view",
  "catalog.category.view",
  "customers.customer.view",
  "sales.sale.view", "sales.sale.create", "sales.sale.update", "sales.sale.validate",
  "sales.sale.receipt_print", "sales.sale.reprint",
  "sales.payment.view", "sales.payment.create",
  "receivables.receivable.view",
  "cash_register.register.view", "cash_register.session.view",
  "cash_register.session.open", "cash_register.session.close",
  "pos.terminal.use",
  "stock.level.view",
  "alerts.stock.view",
  "inventory_count.inventory.view",
  "restaurant.menu.view",
  "restaurant.menu.availability",
  # Commandes (ADR-0049, D14) : saisie, prise en charge, préparation, service, annulation des
  # lignes reçues ; jamais de réattribution, d'annulation de lignes préparées ni de réglages.
  "restaurant.orders.order.view",
  "restaurant.orders.order.create",
  "restaurant.orders.order.claim",
  "restaurant.orders.order.prepare",
  "restaurant.orders.order.serve",
  "restaurant.orders.order.cancel",
  "subscription.activation.check",
]

# Modèles FACULTATIFS de la restauration (ADR-0049, D12 ; D14 Q5) : jamais créés par le
# provisionnement, ajoutés à la demande (POST /roles/from-template) ; refusés si un rôle
# personnalisé porte déjà leur nom (409 role_name_taken, sans renommage automatique).
# Fonction dans la commande (responsable, préparateur, personne qui sert) ≠ rôle.

[roles.waiter]
name = "Serveur"
description = "Restauration : consultation du menu (avec « épuisé ») et des commandes, saisie, prise en charge, service et remise des commandes ; aucun encaissement, aucune annulation."
auto_provision = false
permissions = [
  "restaurant.menu.view",
  "restaurant.menu.availability",
  "restaurant.orders.order.view",
  "restaurant.orders.order.create",
  "restaurant.orders.order.claim",
  "restaurant.orders.order.serve",
]

[roles.preparer]
name = "Préparateur"
description = "Restauration : consultation du menu (avec « épuisé ») et des commandes, préparation (en préparation, prête, correction) ; ni saisie, ni service, ni encaissement, ni annulation."
auto_provision = false
permissions = [
  "restaurant.menu.view",
  "restaurant.menu.availability",
  "restaurant.orders.order.view",
  "restaurant.orders.order.prepare",
]

[roles.viewer]
name = "Consultant"
description = "Consultation, sans accès aux utilisateurs, aux rôles, au journal d'audit ni aux modules."
permissions = ["*.view", "sales.sale.view_all"]
exclude = ["users.*", "audit.*", "organization.module.*"]
