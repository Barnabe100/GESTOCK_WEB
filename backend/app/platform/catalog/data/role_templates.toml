# Rôles de base (rôles système) proposés à chaque entreprise, instanciés à sa création ou à la
# demande (POST /roles/from-template). Les permissions sont des motifs (`module.*`, `*.view`)
# **résolus à l'exécution** contre le registre (ADR-0013) : un nouveau module enrichit
# automatiquement les rôles concernés, sans migration de données. `exclude` retire des motifs
# du résultat ; `protected` interdit toute désactivation ou modification par le tenant.
# Aucune permission de module non développé : les modèles sont complétés quand le module existe.
# Le propriétaire n'est pas un rôle : c'est un attribut de l'appartenance (is_owner).
# Les codes sont stables (référencés en base par roles.template_code) ; les noms sont affichés.

[roles.administrator]
name = "Administrateur"
description = "Administration complète de l'entreprise (tous les modules de l'offre)."
permissions = ["*"]
protected = true

[roles.manager]
name = "Gestionnaire"
description = "Catalogue, fournisseurs, clients, ventes, encaissements et créances (consultation), caisses (sessions, entrées et sorties), point de vente, stock (entrées, sorties, transferts, seuils, inventaires) et alertes, sans annulation (sauf des inventaires non validés) ni gestion des motifs de sortie."
permissions = [
  "catalog.*",
  "suppliers.*",
  "customers.*",
  "sales.sale.view", "sales.sale.create", "sales.sale.update", "sales.sale.validate",
  "sales.payment.view", "sales.payment.create",
  "receivables.receivable.view",
  "cash_register.*",
  "pos.*",
  "stock.level.view", "stock.threshold.manage",
  "stock.movement.view",
  "stock.entry.view", "stock.entry.create", "stock.entry.update", "stock.entry.validate",
  "stock.exit.view", "stock.exit.create", "stock.exit.update", "stock.exit.validate",
  "stock.transfer.view", "stock.transfer.create", "stock.transfer.update",
  "stock.transfer.validate",
  "alerts.*",
  "inventory_count.*",
]

[roles.seller]
name = "Vendeur"
description = "Vente comptant (création, modification et validation des ventes, encaissement, ouverture et clôture de caisse, point de vente), consultation des articles, du stock, des alertes, des inventaires, des clients et des créances ; sans annulation."
permissions = [
  "catalog.article.view",
  "catalog.category.view",
  "customers.customer.view",
  "sales.sale.view", "sales.sale.create", "sales.sale.update", "sales.sale.validate",
  "sales.payment.view", "sales.payment.create",
  "receivables.receivable.view",
  "cash_register.register.view", "cash_register.session.view",
  "cash_register.session.open", "cash_register.session.close",
  "pos.terminal.use",
  "stock.level.view",
  "alerts.stock.view",
  "inventory_count.inventory.view",
]

[roles.viewer]
name = "Consultant"
description = "Consultation, sans accès aux utilisateurs, aux rôles, au journal d'audit ni aux modules."
permissions = ["*.view"]
exclude = ["users.*", "audit.*", "organization.module.*"]
