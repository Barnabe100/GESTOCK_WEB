code = "restaurant.pizzeria"
sector = "restaurant"
ux_profile = "restaurant.default"
name = "Pizzeria"
description = "Pizzas sur place, à emporter ou en livraison."
sort_order = 60

# Modules activés par défaut / facultatifs (ADR-0049, D11) : surcharge de restaurant.default.
modules = [
  "catalog", "suppliers", "customers", "stock", "inventory_count", "sales", "receivables",
  "payments", "cash_register", "pos", "reports", "alerts",
  "restaurant.menu", "restaurant.orders", "restaurant.tables", "restaurant.kitchen",
]
optional_modules = ["restaurant.qr", "restaurant.recipes"]

# Paiement par défaut des commandes du site (ADR-0049, D6 / D11) : recopié à l'activation du
# module sur un site, modifiable ensuite par le gestionnaire, jamais réécrit.
[module_settings."restaurant.orders"]
payment_timing = "AT_END"
