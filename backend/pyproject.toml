[project]
name = "stockmanager-backend"
version = "0.1.0"
description = "StockManager Web — API backend (FastAPI)"
requires-python = ">=3.11"
authors = [{ name = "TechNova" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx2>=2.13",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
