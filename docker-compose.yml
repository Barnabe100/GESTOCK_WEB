# Environnement de développement local StockManager Web.
# Usage : docker compose up --build
#
# Rôles PostgreSQL :
#   - stockmanager          : propriétaire du schéma (migrations, catalogue, CLI TechNova)
#   - stockmanager_app      : rôle de l'API des entreprises, sans BYPASSRLS
#   - stockmanager_platform : rôle de la console TechNova, sans BYPASSRLS, droits minimaux
#                             (créés par docker/postgres/init ; ADR-0031)
name: stockmanager

x-backend-env: &backend-env
  SM_ENVIRONMENT: development
  SM_DEBUG: "true"
  SM_DATABASE_URL: postgresql+psycopg://stockmanager_app:stockmanager_app@db:5432/stockmanager
  SM_MIGRATION_DATABASE_URL: postgresql+psycopg://stockmanager:stockmanager@db:5432/stockmanager
  SM_DB_APP_ROLE: stockmanager_app
  SM_PLATFORM_DATABASE_URL: postgresql+psycopg://stockmanager_platform:stockmanager_platform@db:5432/stockmanager
  SM_DB_PLATFORM_ROLE: stockmanager_platform
  SM_JWT_SECRET: dev-only-change-me-in-production-0123456789abcdef
  SM_REFRESH_COOKIE_SECURE: "false"
  SM_PLATFORM_COOKIE_SECURE: "false"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockmanager
      POSTGRES_USER: stockmanager
      POSTGRES_PASSWORD: stockmanager
      POSTGRES_APP_USER: stockmanager_app
      POSTGRES_APP_PASSWORD: stockmanager_app
      POSTGRES_PLATFORM_USER: stockmanager_platform
      POSTGRES_PLATFORM_PASSWORD: stockmanager_platform
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmanager -d stockmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations + catalogue (profils, plans, politiques), puis arrêt.
  migrate:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && stockmanager catalog sync"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Console TechNova (ADR-0031) : processus distinct, rôle SQL dédié. Port publié sur la
  # boucle locale seulement ; en production, réseau restreint (VPN / liste d'adresses).
  console:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["uvicorn", "app.console.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment: *backend-env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_PLATFORM_API_PROXY_TARGET: http://console:8001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
      - console

volumes:
  db-data:
