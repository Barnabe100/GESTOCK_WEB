# Archivage continu des WAL (PITR) — R11-0, ADR-0057. À inclure dans postgresql.conf d'un
# serveur hors Docker (include_if_exists) ; en Docker, mêmes réglages passés en arguments par
# docker-compose.backup.yml / docker-compose.prod.example.yml.
#
# archive_command : compression gzip, relecture comparée à la source, fsync, renommage atomique,
# jamais d'écrasement (ops/backup/sm-wal-archive.sh). SM_BACKUP_DIR doit être défini dans
# l'environnement du serveur PostgreSQL et désigner un AUTRE disque que les données.
# RPO : archive_timeout (5 min) ; la supervision alerte au-delà de 15 min de retard réel
# (segments terminés non archivés), jamais sur une base inactive.
wal_level = replica
archive_mode = on
archive_command = '/opt/stockmanager/backup/sm-wal-archive.sh %p %f'
archive_timeout = 300
max_wal_senders = 5
