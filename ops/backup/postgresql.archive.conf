# Archivage continu des WAL (PITR) — à inclure dans postgresql.conf du serveur de production
# (include_if_exists) ou à passer en arguments (docker-compose.prod.example.yml).
#
# RPO : au plus archive_timeout (5 min) — cible contractuelle 15 min, mesurée par
# ops/backup/sm-backup-drill.sh. L'archive (SM_BACKUP_DIR) doit être sur un AUTRE disque que les
# données, et copiée hors du serveur (docs/exploitation/SAUVEGARDE_RESTAURATION.md §3).
wal_level = replica
archive_mode = on
archive_command = '/opt/stockmanager/backup/sm-wal-archive.sh %p %f'
archive_timeout = 300
max_wal_senders = 3
