name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockmanager
          POSTGRES_PASSWORD: stockmanager
          POSTGRES_DB: stockmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockmanager -d stockmanager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SM_TEST_DATABASE_URL: postgresql+psycopg://stockmanager_app:stockmanager_app@localhost:5432/stockmanager_test
      SM_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://stockmanager:stockmanager@localhost:5432/stockmanager_test
      SM_MIGRATION_DATABASE_URL: postgresql+psycopg://stockmanager:stockmanager@localhost:5432/stockmanager_test
      SM_DB_APP_ROLE: stockmanager_app
      SM_TEST_PLATFORM_DATABASE_URL: postgresql+psycopg://stockmanager_platform:stockmanager_platform@localhost:5432/stockmanager_test
      SM_DB_PLATFORM_ROLE: stockmanager_platform
      SM_TEST_PURGE_DATABASE_URL: postgresql+psycopg://stockmanager_purge:stockmanager_purge@localhost:5432/stockmanager_test
      SM_DB_PURGE_ROLE: stockmanager_purge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances
        run: uv sync --frozen

      # Tests d'intégration des licences (tests/test_signing_live.py) : le VRAI Signing Service
      # est démarré par les tests avec une paire de clés éphémère générée hors du dépôt.
      - name: Installer le Signing Service (intégration des licences)
        working-directory: signing-service
        run: uv sync --frozen

      - name: Créer le rôle applicatif (sans BYPASSRLS)
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: stockmanager
          POSTGRES_USER: stockmanager
          POSTGRES_DB: stockmanager_test
          POSTGRES_APP_PASSWORD: stockmanager_app
        run: ./docker/postgres/init/01-app-role.sh

      - name: Créer le rôle de la console TechNova (sans BYPASSRLS)
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: stockmanager
          POSTGRES_USER: stockmanager
          POSTGRES_DB: stockmanager_test
          POSTGRES_PLATFORM_PASSWORD: stockmanager_platform
        run: ./docker/postgres/init/02-platform-role.sh

      - name: Créer le rôle de purge des notifications (sans BYPASSRLS)
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: stockmanager
          POSTGRES_USER: stockmanager
          POSTGRES_DB: stockmanager_test
          POSTGRES_PURGE_PASSWORD: stockmanager_purge
        run: ./docker/postgres/init/03-purge-role.sh

      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Typage (mypy --strict)
        run: uv run mypy app

      - name: Catalogue (profils, plans, politiques)
        run: uv run stockmanager catalog check

      - name: Tests (PostgreSQL réel, RLS active)
        run: uv run pytest

      - name: Migrations — pas de dérive modèle/schéma
        run: uv run alembic check

      - name: Migrations — réversibles
        run: uv run alembic downgrade base && uv run alembic upgrade head

  signing-service:
    # Service de signature des licences (ADR-0034) : tests avec des clés ÉPHÉMÈRES générées
    # à l'exécution ; aucune clé ni aucun secret n'est fourni à ce job.
    name: Signing Service (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signing-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: signing-service/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy signing_service
      - run: uv run pytest

  frontend:
    name: Frontend (lint, format, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose (configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Complément de sauvegarde (port et volume inchangés)
        env:
          SM_BACKUP_HOST_DIR: /tmp/backups
        run: |
          docker compose -f docker-compose.yml -f docker-compose.backup.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.backup.yml config --format json > merged.json
          python3 -c "import json; c=json.load(open('merged.json')); db=c['services']['db']; assert [p['published'] for p in db['ports']] == ['5432'], db['ports']; assert c['volumes']['db-data']['name'] == 'stockmanager_db-data'; assert 'archive_mode=on' in db['command']"
      # Exemple de production : configuration valide avec des valeurs factices (aucun secret).
      - name: Compose de production (configuration)
        env:
          SM_IMAGE_BACKEND: example/backend:ci
          SM_IMAGE_FRONTEND: example/frontend:ci
          SM_ENV_FILE: /dev/null
          SM_BACKUP_HOST_DIR: /tmp/backups
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_APP_PASSWORD: ci
          POSTGRES_PLATFORM_PASSWORD: ci
          POSTGRES_PURGE_PASSWORD: ci
        run: docker compose -f docker-compose.prod.example.yml config --quiet

  images:
    name: Images de production (construction, sans publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image backend
        run: docker build -f docker/backend/Dockerfile.prod -t sm-backend:ci .
      - name: Image frontend
        run: docker build -f docker/frontend/Dockerfile.prod -t sm-frontend:ci .
      - name: Contrôles des images
        run: |
          # Utilisateur non root ; démarrage refusé en production sans secrets ; nginx valide.
          test "$(docker run --rm --entrypoint id sm-backend:ci -u)" = "10001"
          if docker run --rm sm-backend:ci python -c "import app.main" 2>/dev/null; then
            echo "démarrage accepté sans secrets" && exit 1
          fi
          docker run --rm -e SM_API_UPSTREAM=http://127.0.0.1:8000 \
            -e SM_CONSOLE_UPSTREAM=http://127.0.0.1:8001 sm-frontend:ci \
            sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
          # Aucune clé privée dans l'image (ADR-0034) : le code et les données de l'application.
          # (motif écrit en deux parties : ce fichier est lui-même contrôlé par
          # tests/test_licensing_crypto.py::test_no_private_key_is_versioned).
          docker run --rm --entrypoint sh sm-backend:ci -c '! grep -rIlE "PRIVATE KEY-{5}" /app'

  backup-unit:
    name: Sauvegardes — tests unitaires (Alpine, busybox) et shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning -s bash ops/backup/*.sh ops/backup/tests/*.sh ops/monitoring/*.sh
          shellcheck -S warning -s sh ops/backup/sm-offsite-sync.sh ops/backup/tests/sm-offsite-test.sh
      # Même image que la production Docker : bash + outils busybox, utilisateur postgres.
      - name: Tests unitaires dans postgres:16-alpine
        run: docker run --rm -u postgres -v "$PWD:/repo:ro" postgres:16-alpine bash /repo/ops/backup/tests/sm-backup-unit-test.sh
      # Copie externe : dépôt Restic LOCAL et clé éphémère (aucun fournisseur, aucun secret).
      - name: Copie externe dans restic/restic
        run: docker run --rm --entrypoint sh -v "$PWD:/repo:ro" restic/restic:0.17.3 /repo/ops/backup/tests/sm-offsite-test.sh
      - name: Unités systemd
        run: |
          d="$(mktemp -d)"; cp ops/systemd/* "$d/"
          sed -i "s#/opt/stockmanager/ops/backup/sm-backup-host.sh#/bin/true#; s#EnvironmentFile=#EnvironmentFile=-#" "$d/stockmanager-backup@.service"
          for u in weekly verify restore-test health offsite; do cp "$d/stockmanager-backup@.service" "$d/stockmanager-backup@$u.service"; done
          out="$(SYSTEMD_UNIT_PATH="$d:" systemd-analyze verify "$d"/*.timer "$d/stockmanager-backup@weekly.service" 2>&1)"; echo "$out"
          test -z "$out"

  backup-drill:
    name: Sauvegarde et restauration — exercice complet (natif)
    runs-on: ubuntu-latest
    # Image officielle PostgreSQL 16 (même version majeure que la production) : serveur et
    # outils ; l'exercice y monte son PROPRE cluster temporaire (utilisateur « postgres »).
    container: postgres:16-bookworm
    steps:
      - name: Outils (Git, certificats, procps)
        run: apt-get update -q && apt-get install -y -q git ca-certificates curl procps
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances
        working-directory: backend
        run: uv sync --frozen
      - name: Exercice complet (PITR, test de restauration, cas négatifs)
        env:
          SM_PG_BINDIR: /usr/lib/postgresql/16/bin
          SM_DRILL_REPORT: ${{ github.workspace }}/backup-drill-report.json
        run: ops/backup/sm-backup-drill.sh --mode native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-drill-report
          path: ${{ github.workspace }}/backup-drill-report.json
          if-no-files-found: ignore

  backup-docker:
    name: Sauvegarde et restauration — Docker Compose (postgres:16-alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances
        working-directory: backend
        run: uv sync --frozen
      - name: Client PostgreSQL
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      # Projet Compose de TEST à nom unique : docker-compose.yml + docker-compose.backup.yml,
      # données créées AVANT l'activation (empreinte, volume et port vérifiés inchangés).
      - name: Exercice complet en conteneurs
        env:
          SM_DRILL_REPORT: ${{ github.workspace }}/backup-docker-report.json
        run: ops/backup/sm-backup-drill.sh --mode docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-docker-report
          path: ${{ github.workspace }}/backup-docker-report.json
          if-no-files-found: ignore
